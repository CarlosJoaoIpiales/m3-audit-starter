name: Publish to GitHub Packages

# AD-7: publishes on v* tags only. GitHub Packages rejects re-publishing an
# already-published version, which is what guarantees a reproducible
# rollback for every consumer pinned to an exact version (no SNAPSHOT, no
# ranges).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify the tag matches pom.xml's <version>
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version)
          if [ "$TAG_VERSION" != "$POM_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $POM_VERSION" >&2
            exit 1
          fi

      - name: Build and run tests
        run: ./mvnw -B -s .mvn/settings-ci.xml verify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to GitHub Packages
        run: ./mvnw -B -s .mvn/settings-ci.xml -DskipTests deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
