spring.datasource.url=jdbc:h2:mem:m3auditstarter;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# AD-1: create/drop are untouched by AuditTablesSchemaFilterProvider -- exactly
# what lets these tests boot the audit_logs/revinfo/*_aud schema on H2 without
# any user-backend migration.
m3.audit.service-name=sample-app
